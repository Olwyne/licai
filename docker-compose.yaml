services:
    traefik:
        container_name: licai_traefik
        image: traefik:v3.6
        restart: unless-stopped
        ports:
            - 80:80
            - 443:443
            - 8080:8080
        command:
            - --global.sendAnonymousUsage=false
            - --providers.docker
            - --providers.docker.exposedbydefault=false
            - --providers.file.filename=/etc/traefik/config.yml
            - --api.insecure=true
            - --entryPoints.web.address=:80
            - --entryPoints.websecure.address=:443
            - --entryPoints.web.http.redirections.entryPoint.to=websecure
            - --entryPoints.web.http.redirections.entryPoint.scheme=https
        volumes:
            - ./orchestrator/config.yml:/etc/traefik/config.yml:ro
            - ./orchestrator/certs:/etc/certs:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro,delegated

    web:
        container_name: licai_web
        build: .
        restart: unless-stopped
        env_file: .env
        labels:
            - traefik.enable=true
            - traefik.http.routers.licai.rule=Host(`${APP_DOMAIN}`)
            - traefik.http.routers.licai.entrypoints=websecure
            - traefik.http.routers.licai.tls=true
            - traefik.http.services.licai.loadbalancer.server.port=3000
        depends_on:
            - mailpit
        environment:
            # e-mails de dev (réinitialisation de mot de passe) : interceptés par Mailpit, jamais envoyés
            SMTP_URL: smtp://mailpit:1025
            MAIL_FROM: "Lǐcái <no-reply@licai.localhost>"
            WATCHPACK_POLLING: "true"
            CHOKIDAR_USEPOLLING: "true"
        working_dir: /app
        volumes:
            - .:/app
            - node_modules:/app/node_modules
            - next_cache:/app/.next

    # Boîte de réception de développement (équivalent local de Mailtrap) : https://mail.${APP_DOMAIN}
    mailpit:
        container_name: licai_mailpit
        image: axllent/mailpit:latest
        restart: unless-stopped
        ports:
            - 127.0.0.1:1025:1025 # SMTP (pour lancer l'app hors Docker : SMTP_URL=smtp://localhost:1025)
        environment:
            MP_MAX_MESSAGES: 500
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
        labels:
            - traefik.enable=true
            - traefik.http.routers.licai-mail.rule=Host(`mail.${APP_DOMAIN}`)
            - traefik.http.routers.licai-mail.entrypoints=websecure
            - traefik.http.routers.licai-mail.tls=true
            - traefik.http.services.licai-mail.loadbalancer.server.port=8025

volumes:
    node_modules:
    next_cache:
