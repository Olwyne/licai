services:
    traefik:
        container_name: licai_traefik
        image: traefik:v3.6
        restart: unless-stopped
        ports:
            - 80:80
            - 443:443
            - 8080:8080
        command:
            - --global.sendAnonymousUsage=false
            - --providers.docker
            - --providers.docker.exposedbydefault=false
            - --providers.file.filename=/etc/traefik/config.yml
            - --api.insecure=true
            - --entryPoints.web.address=:80
            - --entryPoints.websecure.address=:443
            - --entryPoints.web.http.redirections.entryPoint.to=websecure
            - --entryPoints.web.http.redirections.entryPoint.scheme=https
        volumes:
            - ./orchestrator/config.yml:/etc/traefik/config.yml:ro
            - ./orchestrator/certs:/etc/certs:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro,delegated

    web:
        container_name: licai_web
        build: .
        restart: unless-stopped
        env_file: .env
        labels:
            - traefik.enable=true
            - traefik.http.routers.licai.rule=Host(`${APP_DOMAIN}`)
            - traefik.http.routers.licai.entrypoints=websecure
            - traefik.http.routers.licai.tls=true
            - traefik.http.services.licai.loadbalancer.server.port=3000
        environment:
            WATCHPACK_POLLING: "true"
            CHOKIDAR_USEPOLLING: "true"
        working_dir: /app
        volumes:
            - .:/app
            - node_modules:/app/node_modules
            - next_cache:/app/.next

volumes:
    node_modules:
    next_cache:
