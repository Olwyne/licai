<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5046e5">
  <title>Hors ligne — Lǐcái</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f0f11; color: #e8e8ea; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; }
    main { max-width: 360px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #9a9aa3; line-height: 1.5; margin: 0 0 20px; font-size: 14px; }
    button { background: #1d9e75; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Vous êtes hors ligne</h1>
    <p>Lǐcái a besoin du réseau pour afficher vos données : elles ne sont jamais stockées sur cet appareil. Reconnectez-vous puis réessayez.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
